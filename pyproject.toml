[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vlad-neuroimaging"
version = "0.1.0"
description = "Development tools for the VLAD voxel-based neuroimaging workflow"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<0.14",
    "nibabel>=5,<6",
    "nilearn>=0.10,<0.13",
    "openpyxl>=3.1,<4",
    "pyarrow>=17,<24",
    "rich>=13.9,<15",
    "streamlit>=1.50,<2",
    "templateflow>=24.2,<27",
]

[project.scripts]
vlad = "vlad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlad"]

[tool.hatch.build.targets.wheel.force-include]
"workflows" = "vlad/resources/workflows"
"Masks" = "vlad/resources/Masks"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/workflows", "/reports", "/reference", "/Masks", "/config", "/docs",
    "/scripts", "/tests", "/docker", "/requirements", "/Makefile",
    "/README.md", "/vlad", "/pyproject.toml", "/uv.lock", "/.python-version", "/.dockerignore", "/.gitignore",
    "/.github",
    "/install.sh",
]

[tool.uv]
required-version = "==0.13.7"
